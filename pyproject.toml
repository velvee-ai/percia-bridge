[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percia-bridge"
version = "0.2.0"
description = "Publishes cameras on your own network (ONVIF, RTSP, Frigate, Home Assistant) to Percia over WHIP."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Velvee, Inc." }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6", "websockets>=13"]

[project.urls]
Homepage = "https://percia.ai"
Source = "https://github.com/velvee-ai/percia-bridge"
Issues = "https://github.com/velvee-ai/percia-bridge/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
percia-bridge = "percia_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: runs real ffmpeg + MediaMTX on localhost (skipped when they are missing)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
