name: Percia Bridge
version: "0.2.0"
slug: percia_bridge
description: Send the cameras you choose from Home Assistant to Percia (video only).
image: ghcr.io/velvee-ai/percia-bridge-addon   # prebuilt multi-arch image, pulled by tag = version below
url: https://github.com/velvee-ai/percia-bridge
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true     # lets the add-on list camera entities through the Supervisor proxy
hassio_api: false
auth_api: false
host_network: false
ingress: true               # the "which cameras" page lives in the Home Assistant sidebar
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Percia Bridge
options:
  api_key: ""
  server: "https://percia.ai"
  log_level: info
  max_height: 720
  max_fps: 15
  max_bitrate_kbps: 1500
schema:
  api_key: password
  server: url
  log_level: list(debug|info|warning|error)
  max_height: int(120,2160)
  max_fps: int(1,30)
  max_bitrate_kbps: int(100,8000)
